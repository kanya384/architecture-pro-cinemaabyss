apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cinemaabyss-gateway
  namespace: cinemaabyss
spec:
  selector:
    istio: ingressgateway # стандартный Istio ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - cinemaabyss.example.com