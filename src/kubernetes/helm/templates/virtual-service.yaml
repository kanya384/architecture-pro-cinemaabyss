apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cinemaabyss-vs
  namespace: cinemaabyss
spec:
  hosts:
    - cinemaabyss.example.com
  gateways:
    - cinemaabyss-gateway
  http:
    - match:
        - uri:
            prefix: /api/movies
      route:
        - destination:
            host: movies-service
            port:
              number: 8081

    - match:
        - uri:
            prefix: /api/events
      route:
        - destination:
            host: events-service
            port:
              number: 8082

    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: monolith
            port:
              number: 8080